<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1c1622" />
        <meta name="description" content="PlayMenu — gestão e experiência digital para restaurantes." />

        <!-- As folhas legadas são aplicadas pelo React conforme a rota. O preload aqui
             dispara o download junto com o HTML, então quando o app monta o CSS já está
             em cache e a página nunca aparece sem estilo. -->
        <link rel="preload" as="style" href="/public/assets/css/playmenu-ui.css" />
        <link rel="preload" as="style" href="/public/assets/css/dashboard.css" />
        <link rel="preload" as="style" href="/public/assets/css/app.css" />

        <link rel="preconnect" href="%REACT_APP_BACKEND_URL%" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

        <style>
            html { background: #1c1622; }
            body { margin: 0; background: #1c1622; }
            /* Enquanto uma folha de estilo da rota estiver carregando, o conteúdo fica
               oculto atrás do splash — evita o "flash" de página crua. */
            html.pm-css-pending #root { visibility: hidden; }
            #pm-boot { position: fixed; inset: 0; display: none; place-items: center; background: #1c1622; z-index: 2147483000; }
            html.pm-css-pending #pm-boot { display: grid; }
            #pm-boot i { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.14); border-top-color: #f4581c; animation: pm-boot-spin 0.8s linear infinite; }
            @keyframes pm-boot-spin { to { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) { #pm-boot i { animation-duration: 2.4s; } }
        </style>

        <script src="/public/assets/js/playmenu-ui.js" defer></script>
        <title>PlayMenu</title>
    </head>
    <body>
        <noscript>Ative o JavaScript para usar o PlayMenu.</noscript>
        <div id="pm-boot" aria-hidden="true"><i></i></div>
        <div id="root"></div>
    </body>

</html>
